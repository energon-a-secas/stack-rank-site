<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Dh8wp7RjEhxhv7uXGjQpPSX8s1TFVy1VWmQMAyU9jVE='; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Hash Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
    .log { margin: 10px 0; padding: 10px; background: #2a2a2a; border-radius: 4px; }
    .error { background: #4a1a1a; }
    button { padding: 10px; margin: 5px; }
  </style>
</head>
<body>
  <h1>Hash Routing Test</h1>
  <div id="logs"></div>
  <hr>
  <button id="testHashBtn">Test Current Hash</button>
  <button data-hash="#/test123/">Go to #/test123/</button>
  <button data-hash="#/abc456/">Go to #/abc456/</button>

  <script>
    function log(msg, isError = false) {
      const div = document.createElement('div');
      div.className = 'log' + (isError ? ' error' : '');
      div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
      document.getElementById('logs').appendChild(div);
      console.log(msg);
    }

    function testHash() {
      const hash = window.location.hash;
      log('Full hash: "' + hash + '"');

      const cleaned = hash.slice(1);
      log('After slice(1): "' + cleaned + '"');

      const parts = cleaned.split('/');
      log('Split by /: [' + parts.join(', ') + ']');

      const filtered = parts.filter(Boolean);
      log('After filter(Boolean): [' + filtered.join(', ') + ']');

      const id = filtered[0];
      log('Extracted ID: "' + id + '"');
    }

    // Listeners, not onclick attributes: the page's CSP runs no inline handler.
    document.getElementById('testHashBtn').addEventListener('click', testHash);
    document.querySelectorAll('[data-hash]').forEach(btn => {
      btn.addEventListener('click', () => { window.location.hash = btn.dataset.hash; });
    });

    // Test on load
    document.addEventListener('DOMContentLoaded', () => {
      log('Page loaded');
      testHash();
    });

    // Test on hash change
    window.addEventListener('hashchange', () => {
      log('Hash changed!');
      testHash();
    });
  </script>
</body>
</html>
